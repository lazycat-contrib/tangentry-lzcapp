version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/tangentry.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: tangentry

build:
  toolchains: []
  run_buildscript: false

images:
  - id: tangentry
    target: service
    service: tangentry
    source: muzileee/tangentry
    channel: stable
    sort: semver
    # Upstream publishes 0.0.x releases only; exclude the floating latest tag.
    tag_regex: ^[0-9]+[.][0-9]+[.][0-9]+$
    delivery:
      # 社区商店用 mirror 模式：经 1ms.run 加速拉取，digest 校验与上游一致
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Tangentry 探知
    summary: 自动跟上游 Docker Hub 版本发布的本地优先阅读与笔记工具
